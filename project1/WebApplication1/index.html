<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 100px;
            padding: 20px;
            background-color: #adadad;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgb(0, 0, 0);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgb(0, 0, 0);
        }
        h1 {
            color: #ffffff;
        }
        p {
            color: #a9a7a7;
            line-height: 1.6;
        }
        button {
            background-color: #3e434856;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Web Application</h1>
        <p>This is a simple HTML page for your web application.</p>
        <button onclick="alert('Button clicked!')">Click Me</button>
    </div>
</body>
</html>
